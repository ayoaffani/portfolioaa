<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="sty.css">
</head>
<body>

<section class="contact-page">
  <div class="container contact-grid">

    <div>
      <h1>Let's talk about your project.</h1>
      <p>Tell me what you're building, where you're stuck, and what results you're chasing.</p>
    </div>

    <form action="https://formsubmit.co/ayoaffani@gmail.com" method="POST" class="contact-form">

      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="thank-you.html">

      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <textarea name="project" rows="5" placeholder="Project details" required></textarea>
      <input type="text" name="budget" placeholder="Budget / Timeline">

      <button type="submit" class="btn">Send Message</button>

    </form>

  </div>
</section>

</body>
</html>
